[workspace]
resolver = "3"
members = [
    #"crates/codegen",
    "crates/core",
    "crates/frontend",
    "crates/frontend/uitest",
    "crates/lir",
    "crates/lir/filetests",
    "crates/runtime",
]

[workspace.dependencies]
arrayvec = "0.7.8"
bit-set = "0.11.1"
bitflags = "2.13.2"
bumpalo = { version = "3.20.3", features = ["collections", "allocator-api2"] }
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
cbit = "0.1.1"
clay-core = { path = "crates/core" }
clay-lir = { path = "crates/lir" }
codespan-reporting = "0.13.1"
color-eyre = "0.6.5"
compact_str = "0.10.0"
crossbeam-utils = "0.8.23"
derive-where = "1.7.0"
disjoint = "0.8.0"
foldhash = "0.2.0"
hashbrown = "0.17.1"
index_vec = "0.1.4"
indexmap = "2.14.2"
indoc = "2.0.8"
parking_lot = "0.12.5"
paste = "1.0.15"
portable-atomic = "1.15.0"
pretty_assertions = "1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
scopeguard = "1.2.0"
slotmap = "1.1.1"
smallvec = { version = "1.16.3", features = ["const_generics"] }
syn = "3.0.9"
termcolor = "1.4.1"
thiserror = "2.0.21"
thread_local = "1.1.10"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-xid = "0.2.6"
